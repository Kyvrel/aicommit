name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update, for example v1.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
      PNPM_VERSION: '10.12.1'
      RELEASE_DIR: release/aicommit-linux-x64
      ASSET_NAME: aicommit-linux-x64.tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build

      - name: Prepare release directory
        run: |
          rm -rf release
          mkdir -p "${RELEASE_DIR}"
          cp -R dist "${RELEASE_DIR}/dist"
          cp package.json pnpm-lock.yaml README.md "${RELEASE_DIR}/"
          printf '%s\n' "${RELEASE_TAG}" > "${RELEASE_DIR}/.release-version"

      - name: Install production dependencies into release directory
        run: pnpm install --prod --frozen-lockfile --ignore-scripts
        working-directory: ${{ env.RELEASE_DIR }}

      - name: Verify packaged CLI
        run: node dist/cli.js --help
        working-directory: ${{ env.RELEASE_DIR }}

      - name: Create release archive
        run: tar -czf "${ASSET_NAME}" -C release aicommit-linux-x64

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ env.ASSET_NAME }}
